<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<meta
  name="theme-color"
  content="#172B4D">

<title>
ONE49 Security Portal
</title>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f4f6;
  color: #1f2937;
}

.header {
  background: #172B4D;
  color: white;
  text-align: center;
  padding: 19px 15px;
}

.header h1 {
  margin: 0;
  font-size: 22px;
}

.header p {
  margin: 5px 0 0;
  font-size: 13px;
  opacity: .9;
}

.version {
  margin-top: 5px;
  font-size: 11px;
  opacity: .65;
}

.container {
  width: 100%;
  max-width: 620px;
  margin: auto;
  padding: 16px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 6px;
}

.description {
  color: #6b7280;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 15px;
}

label {
  display: block;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 6px;
}

input,
select {
  width: 100%;
  height: 50px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  padding: 0 13px;
  font-size: 16px;
  margin-bottom: 15px;
  background: white;
}

button {
  width: 100%;
  min-height: 52px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}

.primary {
  background: #0F766E;
  color: white;
}

.danger {
  background: #991B1B;
  color: white;
  margin-top: 10px;
}

.hidden {
  display: none !important;
}

#reader {
  width: 100%;
  margin-top: 15px;
  overflow: hidden;
  border-radius: 12px;
}

.status {
  margin-top: 12px;
  padding: 13px;
  border-radius: 9px;
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  background: #eaf2ff;
  color: #172B4D;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.officer {
  background: #eaf2ff;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 15px;
  font-size: 13px;
  color: #172B4D;
  text-align: center;
  font-weight: bold;
}

.logout {
  display: block;
  text-align: center;
  margin-top: 14px;
  color: #991b1b;
  text-decoration: none;
  font-size: 13px;
}

.footer {
  text-align: center;
  color: #9ca3af;
  font-size: 11px;
  margin: 15px 0 25px;
}

</style>

</head>


<body>


<div class="header">

  <h1>
    ONE49 Security Portal
  </h1>

  <p>
    Visitor & Service Access Verification
  </p>

  <div class="version">
    Security Portal V2.4
  </div>

</div>


<div class="container">


  <!-- LOGIN -->

  <div
    id="loginCard"
    class="card hidden">

    <div class="title">
      Security Officer Login
    </div>

    <div class="description">
      Authorized security personnel only.
    </div>


    <form
      id="loginForm"
      method="POST">

      <input
        type="hidden"
        name="action"
        value="login">


      <label>
        Officer ID
      </label>

      <input
        type="text"
        name="officerId"
        placeholder="SEC001"
        autocomplete="username"
        required>


      <label>
        PIN
      </label>

      <input
        type="password"
        name="pin"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="6"
        placeholder="6-digit PIN"
        autocomplete="current-password"
        required>


      <label>
        Guard Post
      </label>

      <select
        name="guardPost"
        required>

        <option value="">
          Select Guard Post
        </option>

        <option value="LEVEL 4 — MAIN ENTRANCE">
          Level 4 — Main Entrance
        </option>

        <option value="LEVEL 1 — SERVICE / LOADING">
          Level 1 — Service / Loading
        </option>

      </select>


      <button
        class="primary"
        type="submit">

        🔐 Login

      </button>

    </form>


    <div
      id="loginError"
      class="status error hidden">
    </div>

  </div>


  <!-- SCANNER -->

  <div
    id="scannerCard"
    class="card hidden">

    <div
      class="officer">

      ✓ Security Officer Authenticated

    </div>


    <div class="title">
      Live QR Scanner
    </div>


    <div class="description">
      Scan the visitor or service QR code.
    </div>


    <button
      id="startButton"
      class="primary"
      type="button">

      📷 Start Live Scanner

    </button>


    <div
      id="reader"
      class="hidden">
    </div>


    <button
      id="stopButton"
      class="danger hidden"
      type="button">

      Stop Scanner

    </button>


    <div
      id="status"
      class="status hidden">
    </div>


    <a
      id="logoutButton"
      class="logout"
      href="#">

      Log Out

    </a>

  </div>


  <div class="footer">
    ONE49 Residence Security System
  </div>


</div>


<script>


/**************************************************************
 * IMPORTANT
 *
 * Paste the SAME Apps Script /exec URL currently working.
 **************************************************************/

const ONE49_BACKEND_URL =
  'https://script.google.com/macros/s/AKfycbxoTQgBFcrqzJ3Xoi6Tzb-EUGRaYRpgvSsexBfsA3X_8uIf3IA7qW7ed296l-VPuQFZ/exec';


let scanner =
  null;


let scannerActive =
  false;


let processing =
  false;


/**************************************************************
 * URL
 **************************************************************/

const params =
  new URLSearchParams(
    window.location.search
  );


const session =
  String(
    params.get('session') || ''
  ).trim();


const loginError =
  String(
    params.get('loginError') || ''
  ).trim();


/**************************************************************
 * ELEMENTS
 **************************************************************/

const loginCard =
  document.getElementById(
    'loginCard'
  );


const scannerCard =
  document.getElementById(
    'scannerCard'
  );


const loginForm =
  document.getElementById(
    'loginForm'
  );


const loginErrorBox =
  document.getElementById(
    'loginError'
  );


const startButton =
  document.getElementById(
    'startButton'
  );


const stopButton =
  document.getElementById(
    'stopButton'
  );


const reader =
  document.getElementById(
    'reader'
  );


const statusBox =
  document.getElementById(
    'status'
  );


const logoutButton =
  document.getElementById(
    'logoutButton'
  );


/**************************************************************
 * INITIALIZE
 **************************************************************/

loginForm.action =
  ONE49_BACKEND_URL;


if (
  session
) {

  scannerCard
    .classList
    .remove(
      'hidden'
    );


  logoutButton.href =
    ONE49_BACKEND_URL +
    '?action=logout&session=' +
    encodeURIComponent(
      session
    );

}

else {

  loginCard
    .classList
    .remove(
      'hidden'
    );

}


if (
  loginError
) {

  loginErrorBox.textContent =
    loginError;


  loginErrorBox
    .classList
    .remove(
      'hidden'
    );

}


/**************************************************************
 * START SCANNER
 **************************************************************/

startButton
  .addEventListener(
    'click',
    startScanner
  );


async function startScanner() {

  if (
    scannerActive
  ) {

    return;

  }


  processing =
    false;


  startButton.disabled =
    true;


  reader
    .classList
    .remove(
      'hidden'
    );


  stopButton
    .classList
    .remove(
      'hidden'
    );


  showStatus(
    'Starting camera...',
    ''
  );


  try {

    scanner =
      new Html5Qrcode(
        'reader'
      );


    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'No camera found.'
      );

    }


    let cameraId =
      cameras[0].id;


    const rear =
      cameras.find(
        function(camera) {

          const label =
            String(
              camera.label || ''
            )
              .toLowerCase();


          return (
            label.includes('back') ||
            label.includes('rear') ||
            label.includes('environment')
          );

        }
      );


    if (rear) {

      cameraId =
        rear.id;

    }


    await scanner.start(

      cameraId,

      {

        fps:
          12,

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.floor(
                Math.min(
                  width,
                  height
                ) *
                .72
              );


            return {

              width:
                size,

              height:
                size

            };

          }

      },

      qrSuccess,

      function() {}

    );


    scannerActive =
      true;


    showStatus(
      'Camera ready — scan ONE49 QR.',
      'success'
    );

  }

  catch (error) {

    scanner =
      null;


    scannerActive =
      false;


    startButton.disabled =
      false;


    reader
      .classList
      .add(
        'hidden'
      );


    stopButton
      .classList
      .add(
        'hidden'
      );


    showStatus(
      'Camera error: ' +
      (
        error.message ||
        String(error)
      ),
      'error'
    );

  }

}


/**************************************************************
 * QR SUCCESS
 **************************************************************/

async function qrSuccess(
  decodedText
) {

  if (
    processing
  ) {

    return;

  }


  processing =
    true;


  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      100
    );

  }


  await stopScanner();


  const qr =
    String(
      decodedText || ''
    ).trim();


  const parts =
    qr.split('|');


  if (
    parts.length !== 3 ||
    String(
      parts[0]
    )
      .trim()
      .toUpperCase() !==
      'ONE49'
  ) {

    processing =
      false;


    showStatus(
      'Invalid ONE49 QR Code.',
      'error'
    );


    return;

  }


  const rid =
    normalizeSecure(
      parts[1]
    );


  const token =
    normalizeSecure(
      parts[2]
    );


  if (
    !rid ||
    !token
  ) {

    processing =
      false;


    showStatus(
      'Invalid ONE49 QR Code.',
      'error'
    );


    return;

  }


  submitVerification(
    rid,
    token
  );

}


/**************************************************************
 * SUBMIT VERIFICATION
 **************************************************************/

function submitVerification(
  rid,
  token
) {

  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';


  form.action =
    ONE49_BACKEND_URL;


  form.style.display =
    'none';


  addHidden(
    form,
    'action',
    'verify'
  );


  addHidden(
    form,
    'session',
    session
  );


  addHidden(
    form,
    'rid',
    rid
  );


  addHidden(
    form,
    'token',
    token
  );


  document.body
    .appendChild(
      form
    );


  form.submit();

}


/**************************************************************
 * HIDDEN INPUT
 **************************************************************/

function addHidden(
  form,
  name,
  value
) {

  const input =
    document.createElement(
      'input'
    );


  input.type =
    'hidden';


  input.name =
    name;


  input.value =
    value;


  form.appendChild(
    input
  );

}


/**************************************************************
 * STOP
 **************************************************************/

stopButton
  .addEventListener(
    'click',
    stopScanner
  );


async function stopScanner() {

  try {

    if (
      scanner &&
      scannerActive
    ) {

      await scanner.stop();


      try {

        scanner.clear();

      }

      catch (error) {}

    }

  }

  catch (error) {}


  scanner =
    null;


  scannerActive =
    false;


  startButton.disabled =
    false;


  reader
    .classList
    .add(
      'hidden'
    );


  stopButton
    .classList
    .add(
      'hidden'
    );

}


/**************************************************************
 * NORMALIZE
 **************************************************************/

function normalizeSecure(
  value
) {

  return String(
    value || ''
  )
    .trim()
    .toUpperCase()
    .replace(
      /[^A-Z0-9]/g,
      ''
    );

}


/**************************************************************
 * STATUS
 **************************************************************/

function showStatus(
  message,
  type
) {

  statusBox.className =
    'status';


  if (
    type ===
    'success'
  ) {

    statusBox
      .classList
      .add(
        'success'
      );

  }


  if (
    type ===
    'error'
  ) {

    statusBox
      .classList
      .add(
        'error'
      );

  }


  statusBox.textContent =
    message;


  statusBox
    .classList
    .remove(
      'hidden'
    );

}


</script>

</body>

</html>
